llm:
  default_profile: general

  profiles:
    general:
      provider: openai_compat
      # Runtime values are overridden by LLM_BASE_URL / LLM_MODEL in .env.
      base_url: http://localhost:8000/v1
      api_key_env: LLM_API_KEY
      model: replace-with-your-model-name
      temperature: 0.3
      max_tokens: 8192
      # Set real prices for cost estimates in metadata-only run logs.
      input_cost_per_million_usd: 0
      output_cost_per_million_usd: 0
      json_mode: true
      # Long structured responses can exceed an upstream gateway's non-streaming
      # response deadline. SSE keeps the connection active while preserving the
      # same final text consumed by the workflow.
      stream: true
      # Provider extensions stay in configuration instead of being hard-coded in
      # the generic client. Unsupported keys are retried once without the extra.
      extra_body:
        thinking:
          type: disabled

    rewriter_ft:
      provider: openai_compat
      base_url: http://localhost:8000/v1
      api_key_env: LOCAL_FT_API_KEY
      model: storybridge-rewriter-v1
      temperature: 0.2
      max_tokens: 2048
      json_mode: false

  step_routes:
    parse_story: general
    detect_frictions: general
    plan_adaptation: general
    rewrite_scene: general
    verify_consistency: general
    render_target_script: general
    baseline_translate: general
    baseline_strong_prompt: general

logging:
  sft_log_dir: data/sft_logs
  run_log_dir: data/run_logs
  # Full prompts/completions are never collected unless both this deployment
  # flag and the project's explicit data_policy.sft_opt_in are enabled.
  sft_log_enabled: false
  sft_redact_pii: true
  sft_retention_days: 30

storage:
  projects_dir: data/projects
  jobs_file: data/jobs.json

security:
  # Set STORYBRIDGE_API_KEYS to a JSON token->owner mapping for networked use.
  # Empty means explicit single-user local-demo mode.
  api_keys_env: STORYBRIDGE_API_KEYS
  default_owner: local
  max_script_chars: 500000
  max_active_jobs_per_owner: 4
  max_job_submissions_per_minute: 30
  # Set to 0 to disable. Enforcement uses actual usage when providers return it,
  # otherwise a conservative character-based token estimate.
  max_project_llm_tokens: 1000000
