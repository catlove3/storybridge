llm:
  default_profile: general

  profiles:
    general:
      provider: openai_compat
      # Runtime values are overridden by LLM_BASE_URL / LLM_MODEL in .env.
      base_url: http://localhost:8000/v1
      api_key_env: LLM_API_KEY
      model: replace-with-your-model-name
      temperature: 0.3
      max_tokens: 8192
      json_mode: true
      # Long structured responses can exceed an upstream gateway's non-streaming
      # response deadline. SSE keeps the connection active while preserving the
      # same final text consumed by the workflow.
      stream: true
      # Provider extensions stay in configuration instead of being hard-coded in
      # the generic client. Unsupported keys are retried once without the extra.
      extra_body:
        thinking:
          type: disabled

    rewriter_ft:
      provider: openai_compat
      base_url: http://localhost:8000/v1
      api_key_env: LOCAL_FT_API_KEY
      model: storybridge-rewriter-v1
      temperature: 0.2
      max_tokens: 2048
      json_mode: false

  step_routes:
    parse_story: general
    detect_frictions: general
    plan_adaptation: general
    rewrite_scene: general
    verify_consistency: general

logging:
  sft_log_dir: data/sft_logs
  sft_log_enabled: true

storage:
  projects_dir: data/projects
  jobs_file: data/jobs.json
