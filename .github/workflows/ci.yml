name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Verify requirements.txt matches uv.lock
        run: |
          uv export --frozen --extra dev --no-hashes --no-annotate --no-header --output-file /tmp/storybridge-requirements.txt
          diff -u ../requirements.txt /tmp/storybridge-requirements.txt
      - run: uv run ruff check app tests
      - run: uv run pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: uv sync --directory ../backend --frozen
      - name: Verify generated OpenAPI client is current
        run: npm run openapi:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: uv sync --directory backend --frozen --extra dev
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflow
        working-directory: frontend
        env:
          STORYBRIDGE_E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: npm run e2e
